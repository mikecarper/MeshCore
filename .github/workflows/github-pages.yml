name: Build and deploy Docs site to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '43 10 * * *'
  push:
    branches:
      - main
      - keymindCascade

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
      artifact-name: github-pages-${{ github.run_attempt }}
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          # Release events point at a tag; docs and their pinned controls live
          # on the default branch, not necessarily in that tagged tree.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pinned historical firmware archive
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/meshcore-historical-11801
          key: meshcore-historical-11801-c3368422d6250ac00fdd8bbd2b88036445eaca5e19afd30cdd6cba98a625c666

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          MKDOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MKDOCS_REPO_NAME: ${{ github.repository }}
          MKDOCS_REPO_URL: https://github.com/${{ github.repository }}/
          MKDOCS_EDIT_URI: edit/${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref_name }}/docs/
        run: |
          pip install mkdocs-material
          node test/test_firmware_picker.js
          node test/test_partition_catalog_viewer.js
          node test/test_release_features.js
          python -m unittest discover -s test -p test_deploy_historical_mirror.py
          python -m unittest discover -s test -p test_firmware_release_snapshot.py
          python scripts/sync_bootloader_manifest.py
          python scripts/build_firmware_release_snapshot.py
          mkdocs build
          cmp firmware/esp32_partition_catalog.json site/_data/esp32_partition_catalog.json

      - name: Install pinned historical firmware mirror
        run: |
          python scripts/deploy_historical_mirror.py \
            --url https://github.com/mikecarper/MeshCore/releases/download/utility-v1.18.0.1-halo-keymind-cascade-dev-03214a16/meshcore-1.18.0.1-historical-mirror.tar \
            --sha256 c3368422d6250ac00fdd8bbd2b88036445eaca5e19afd30cdd6cba98a625c666 \
            --size 499752960 \
            --cache-dir "$RUNNER_TEMP/meshcore-historical-11801"

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
        run: |
          # Upload can finish before the artifact appears in run listings.
          for attempt in {1..12}; do
            if artifact_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id | tostring') \
              && [[ -n "$PAGES_ARTIFACT_ID" && "$artifact_id" == "$PAGES_ARTIFACT_ID" ]]; then
              echo "Pages artifact $PAGES_ARTIFACT_NAME ($artifact_id) is available."
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_NAME ($PAGES_ARTIFACT_ID) did not become available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
