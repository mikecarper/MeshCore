name: Build and deploy Docs site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - keymindCascade

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  github-pages:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache pinned historical firmware archive
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/meshcore-historical-11801
          key: meshcore-historical-11801-c3368422d6250ac00fdd8bbd2b88036445eaca5e19afd30cdd6cba98a625c666

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          MKDOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MKDOCS_REPO_NAME: ${{ github.repository }}
          MKDOCS_REPO_URL: https://github.com/${{ github.repository }}/
          MKDOCS_EDIT_URI: edit/${{ github.ref_name }}/docs/
        run: |
          pip install mkdocs-material
          node test/test_firmware_picker.js
          node test/test_partition_catalog_viewer.js
          node test/test_release_features.js
          python -m unittest discover -s test -p test_deploy_historical_mirror.py
          python scripts/sync_bootloader_manifest.py
          mkdocs build
          cmp firmware/esp32_partition_catalog.json site/_data/esp32_partition_catalog.json

      - name: Install pinned historical firmware mirror
        run: |
          python scripts/deploy_historical_mirror.py \
            --url https://github.com/mikecarper/MeshCore/releases/download/utility-v1.18.0.1-halo-keymind-cascade-dev-03214a16/meshcore-1.18.0.1-historical-mirror.tar \
            --sha256 c3368422d6250ac00fdd8bbd2b88036445eaca5e19afd30cdd6cba98a625c666 \
            --size 499752960 \
            --cache-dir "$RUNNER_TEMP/meshcore-historical-11801"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
