          python3 -B test/test_observer_ota_channel.py -v
          python3 -B test/test_observer_build_channels.py -v
          python3 -B scripts/verify_ota_channel.py --self-test

      - name: Verify build output cleanup safety
        run: python3 -B test/test_build_output_safety.py -v

