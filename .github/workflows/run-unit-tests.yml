name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
      - keymindCascade
  pull_request:
  workflow_dispatch:

jobs:
  management-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install real crypto implementations for cross-language tests
        run: |
          python3 -m pip install platformio pycryptodome==3.23.0
          mkdir -p .pio/libdeps/management-test
          pio pkg install --global --library 'rweather/Crypto@0.4.0' --storage-dir .pio/libdeps/management-test
      - name: Verify protocol, encryption, scheduling and MQTT decoding
        run: |
          python3 -B test/test_management_report.py -v
          python3 -B test/test_management_cli_wrapper.py -v
          node test/test_management_decoder.js
          node scripts/test_telemetry_decoder.js

  stm32-companion-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Compile ordinary STM32 USB Companion with pinned core and RadioLib
        run: pio run -e RAK_3x72_companion_radio_usb

      - name: Qualify Wio-E5 Mini Companion at release version length
        run: >-
          bash build.sh build-firmware wio-e5-mini_companion_radio_usb
          --firmware-version v1.17.1.9-halo-keymind-cascade-dev
          --radio-preset usa-cascade-fixed --profile cascade --require-ota

  bootloader-version:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify bootloader version regressions without hardware or downloads
        run: python3 -B test/test_nrf52_bootloader_version.py -v

      - name: Install signed-package verification dependency
        run: python3 -m pip install cryptography

      - name: Verify old-firmware compatibility in both OTA launchers
        run: python3 -B -m unittest discover -s tools/lora_ota -p test_lora_ota_bootloader_version.py -v

      - name: Verify OTA orchestration and automatic relay policy cleanup
        run: python3 -B -m unittest discover -s tools/lora_ota -p 'test_lora_ota*.py' -v

      - name: Verify all signed OTAFIX 2.4.6 release images
        env:
          MESHCORE_BOOTLOADER_MOTA_ZIP: ${{ runner.temp }}/OTAFIX-2.4.6-bootloader-mota.zip
        # The test pins the archive SHA-256, verifies every .mota signature,
        # and checks the exact MeshTower V2 SD CRC from the bug report.
        run: |
          curl --fail --location --retry 3 --max-time 120 --output "$MESHCORE_BOOTLOADER_MOTA_ZIP" \
            https://github.com/mikecarper/Adafruit_nRF52_Bootloader_OTAFIX/releases/download/0.11.0-OTAFIX2.4.6/OTAFIX-2.4.6-bootloader-mota.zip
          python3 -B test/test_nrf52_bootloader_version.py -v

  test:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Install signed-package verification dependency
        run: |
          python3 -m pip install cryptography
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Verify ArduinoJson pin
        run: |
          python3 -B scripts/check_arduinojson_pin.py --self-test
          python3 -B scripts/check_arduinojson_pin.py

      - name: Verify build-size diagnostics and nRF52 optimizer recipes
        run: |
          bash test/test_build_size_detection.sh
          python3 -B test/test_nrf52_size_profile.py -v
          python3 -B test/test_rak_combined_build_config.py -v

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -e native_ota_channel -vv

      - name: Verify parser, delivery, storage, permissions, clock and radio stability
        run: |
          python3 -B test/test_protocol_parser_bounds.py -v
          python3 -B test/test_cli_error_bounds.py -v
          python3 -B test/test_ota_security.py -v
          python3 -B test/test_companion_offline_delivery.py -v
          python3 -B test/test_room_receive_admission.py -v
          python3 -B test/test_companion_lfs_traversal.py -v
          python3 -B test/test_room_post_permissions.py -v
          python3 -B test/test_room_login_authorization.py -v
          python3 -B test/test_room_login_integration.py -v
          python3 -B test/test_room_client_paths.py -v
          python3 -B test/test_room_catchup.py -v
          python3 -B test/test_room_catchup_transport.py -v
          python3 -B test/test_room_topic_store.py -v
          python3 -B test/test_room_topic_delivery.py -v
          python3 -B test/test_room_acl_persistence.py -v
          python3 -B test/test_room_access_policy.py -v
          python3 -B test/test_room_history_store.py -v
          python3 -B test/test_room_history_integration.py -v
          python3 -B test/test_room_board_store.py -v
          python3 -B test/test_room_board_protocol.py -v
          python3 -B test/test_room_web_mailbox.py -v
          python3 -B test/test_room_web_http.py -v
          python3 -B test/test_room_web_service.py -v
          python3 -B test/test_contact_clock_bootstrap.py -v
          python3 -B test/test_rtc_discovery.py -v
          python3 -B test/test_radio_interrupt_recovery.py -v
          python3 -B test/test_bridge_recovery.py -v

      - name: Verify signed private fleet management
        run: |
          python3 -B test/test_fleet_command_crypto.py -v
          python3 -B test/test_companion_fleet_control.py -v
          python3 -B test/test_fleet_channel_runtime.py -v
          python3 -B test/test_fleet_role_wiring.py -v
          python3 -B test/test_fleet_location.py -v
          python3 -B test/test_fleet_radio_schedules.py -v
