          python3 -B test/test_ota_target_names.py -v
          python3 -B test/test_ota_cli_listing.py -v

      - name: Verify compact same-size fonts and lossless rendering
        run: |
          python3 -B test/test_compact_arial.py -v
          python3 -B test/test_compact_noto.py -v
          python3 -B test/test_nrf52_font_license.py -v
          python3 -B test/test_oled_font_experiments.py -v
          python3 -B test/test_font_family_trials.py -v

      - name: Verify Companion Bluetooth settings and WebConfig
        run: |
          python3 -B test/test_gps_voice_buttons.py -v
          python3 -B test/test_gps_voice_generator.py -v
          python3 -B test/test_button_voice_actions.py -v
          python3 -B test/test_button_voice_generator.py -v
          python3 -B test/test_button_voice_preview.py -v
          python3 -B test/test_g726_voice.py -v
          MESH_G726_TEST_SANITIZERS=1 python3 -B test/test_g726_voice.py -v
          python3 -B test/test_g726_voice_generator.py -v
          python3 -B test/test_voice_prefixes.py -v
          MESH_VOICE_TEST_SANITIZERS=1 python3 -B test/test_voice_prefixes.py -v
          python3 -B test/test_nimble_companion.py
          python3 -B test/test_bluetooth_pairing_ui.py
          python3 -B test/test_companion_pairing_display.py
          python3 -B test/test_companion_identity_startup.py
          python3 -B test/test_startup_screen.py
          node test/test_notification_builder.js
          python3 -B test/test_notification_settings.py
          python3 -B test/test_display_power.py
          python3 -B test/test_companion_inbox.py
          python3 -B test/test_heltec_r8_external_power.py
          python3 -B test/test_bluetooth_mac_contract.py
          python3 -B test/test_companion_settings_persistence_contract.py
          python3 -B test/test_webconfig_ui.py
          python3 -B test/test_webconfig_gzip.py
          python3 -B test/test_webconfig_secret_masking.py
          python3 -B test/test_webconfig_station_ownership.py -v
          python3 -B test/test_mqtt_canonical_wifi.py -v
          python3 -B test/test_mqtt_ap_ownership.py -v
          python3 -B test/test_companion_ap_ownership.py -v
          python3 -B test/test_heltec_v4_wifi_setup_page.py -v
          python3 -B test/test_sensor_webconfig_capabilities.py -v
          python3 -B test/test_webconfig_ui_runtime.py
          MESHCORE_REQUIRE_ROOM_BROWSER=1 python3 -B test/test_room_web_ui.py -v

      - name: Upload Test Results
        # Upload test results even if the test step failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pio/build/native/

  hosted-doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install the documentation renderer
        run: python3 -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - name: Verify source links and published page routes
        run: python3 -B test/test_hosted_doc_links.py -v
      - name: Verify hosted-link visibility and navigation
        run: node test/test_hosted_doc_links.js
