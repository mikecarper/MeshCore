[env:Station_G2_room_server_observer_mqtt]
extends = Station_G2
board_build.partitions = default_16MB.csv ; standard 16MB partition table
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${Station_G2.build_flags}
  ; The base observer disables LoRa OTA; build.sh promotes it to FULL and restores OTA.
  -UENABLE_OTA
  -D DISABLE_LORA_OTA=1
  -UMESH_DEBUG
  -UMESH_PACKET_LOGGING
  -UMQTT_DEBUG
  -UMQTT_MEMORY_DEBUG
  -D ADVERT_NAME='"Station G2 Room Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D WITH_MQTT_BRIDGE=1
  -D MAX_NEIGHBOURS=50
  -D MQTT_MAX_PACKET_SIZE=1024
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D ESP32_CPU_FREQ=160
  -D WITH_SNMP=1
build_src_filter = ${Station_G2.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/SNMPAgent.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${Station_G2.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1
  0neblock/SNMP_Agent

[env:Station_G2_room_server]
