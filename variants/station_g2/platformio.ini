[Station_G2]
extends = esp32_base
board = station-g2
; Preserve the original 0x10000/0x150000 dual-OTA layout so app-only updates do
; not require replacing the partition table or erasing an installed G2.
board_build.partitions = default.csv
; The Arduino-ESP32 3.x board manifest defaults to QIO, but the Station G2
; bootloader watchdog-resets before starting the app in that mode. The deployed
; hardware and the working 2.x bootloader both require DIO.
board_build.flash_mode = dio
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/station_g2
  -I src/helpers/ui
  -D STATION_G2
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=48
  -D P_LORA_NSS=11
  -D P_LORA_RESET=21
  -D P_LORA_BUSY=47
  -D P_LORA_SCLK=12
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=13
  -D LORA_TX_POWER=7 ; configured as 7dbm, because the final output will be ~27dbm (~0.5w) if the PA is enabled.
  -D MAX_LORA_TX_POWER=19 ; max output without burning out the PA
;  -D P_LORA_TX_LED=35
  -D PIN_BOARD_SDA=5
  -D PIN_BOARD_SCL=6
  -D PIN_USER_BTN=38
  -D PIN_GPS_RX=15
  -D PIN_GPS_TX=7
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=0 ; Default value when 'radio.rxgain' has not been set. Must be OFF for the Station G2, see:
;  https://wiki.uniteng.com/en/meshtastic/station-g2#impact-of-lora-node-dense-areashigh-noise-environments-on-rf-performance
  -D DISPLAY_CLASS=SH1106Display
  ; Keep the browser firmware uploader, but use CLI configuration so ordinary
  ; G2 roles remain below each legacy 0x140000 (1.25 MiB) application slot.
  -D LIGHTWEIGHT_WIFI_OTA=1
  -D WEBCONFIG_DISABLED=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/station_g2>
  +<helpers/sensors>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SH110X @ ~2.1.13
  adafruit/Adafruit GFX Library @ ^1.12.1

[env:Station_G2_repeater]
extends = Station_G2
board_build.partitions = default.csv
build_flags =
  ${Station_G2.build_flags}
  -D ADVERT_NAME='"Station G2 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Station_G2.build_src_filter}
  +<../examples/simple_repeater>
  -<helpers/bridges/MQTTBridge.cpp>
  -<helpers/MQTTMessageBuilder.cpp>
  -<helpers/JWTHelper.cpp>
lib_deps =
  ${Station_G2.lib_deps}
  ${esp32_ota.lib_deps}

