[env:Station_G2_companion_radio_usb]
extends = Station_G2
build_flags =
  ${Station_G2.build_flags}
  -UENABLE_OTA
  -D DISABLE_LORA_OTA=1
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Station_G2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G2.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G2_companion_radio_ble]
extends = Station_G2
build_flags =
  ${Station_G2.build_flags}
  -UENABLE_OTA
  -D DISABLE_LORA_OTA=1
  ; BLE plus the optional MLX90614/VL53L0X/BME680 drivers leaves no safe growth
  ; margin in a legacy slot. Common temperature, pressure, current, and GPS
  ; sensors remain.
  -UENV_INCLUDE_MLX90614
  -UENV_INCLUDE_VL53L0X
  -UENV_INCLUDE_BME680
  ; Use the ESP32-S3 ROM formatter so this full BLE companion stays within
  ; the Station G2 legacy 0x140000 application partition without dropping UI,
  ; GPS, or any additional external-sensor support.
  -D PORTABLE_ESP32_ROM_NANO_FORMAT=1
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=512
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Station_G2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G2.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G2_companion_radio_wifi]
extends = Station_G2
build_flags =
  ${Station_G2.build_flags}
  -UENABLE_OTA
  -D DISABLE_LORA_OTA=1
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=512
; -D MESH_PACKET_LOGGING=1
; -D MESH_DEBUG=1
build_src_filter = ${Station_G2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G2.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G2_companion_radio_full]
extends = env:Station_G2_companion_radio_wifi
platform = ${esp32_s3_dual_cdc_full.platform}
board_build.flash_mode = ${esp32_s3_full.board_build.flash_mode}
build_unflags = ${esp32_s3_dual_cdc_full.build_unflags}
build_flags =
  ${env:Station_G2_companion_radio_wifi.build_flags}
  ${esp32_s3_dual_cdc_full.build_flags}

[env:Station_G2_kiss_modem]
extends = Station_G2
build_flags =
