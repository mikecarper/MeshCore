; Startup-detected SX1262/SX1268. Chip-specific legacy recipes remain available.

[Meshadventurer_Auto]
extends = Meshadventurer
build_flags =
  ${esp32_base.build_flags}
  -I variants/meshadventurer_universal
  -D MESHADVENTURER
  -D ENV_INCLUDE_GPS=1
  -D P_LORA_TX_LED=2
  -D PIN_VBAT_READ=35
  -D PIN_USER_BTN=39
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=18
  -D P_LORA_RESET=23
  -D P_LORA_BUSY=32
  -D P_LORA_SCLK=5
  -D P_LORA_MOSI=27
  -D P_LORA_MISO=19
  -D SX126X_TXEN=13
  -D SX126X_RXEN=14
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=12
  -D PIN_GPS_TX=15
  -D DISPLAY_CLASS=SSD1306Display
  -D MESH_RADIO_AUTO_FAMILY=1
  -D MESH_RADIO_AUTO_SX1268=1
  -D MESH_RADIO_AUTO_SX127X=0
  -D USE_SX1262
  -D USE_SX1268
  -D RADIO_CLASS=UniversalLoRaRadio
  -D WRAPPER_CLASS=UniversalLoRaRadio
  -D LORA_TX_POWER=22
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/meshadventurer_universal>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps = ${Meshadventurer.lib_deps}

[env:Meshadventurer_repeater]
extends = env:Meshadventurer_sx1262_repeater
build_flags =
  ${Meshadventurer_Auto.build_flags}
  -D ADVERT_NAME='"Meshadventurer Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Meshadventurer_Auto.lib_deps}
  ${esp32_ota.lib_deps}

[env:Meshadventurer_repeater_bridge_espnow]
extends = env:Meshadventurer_sx1262_repeater_bridge_espnow
build_flags =
  ${Meshadventurer_Auto.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31
  -D WITH_ESPNOW_BRIDGE=1
  -D DISABLE_LORA_OTA=1
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Meshadventurer_Auto.lib_deps}
  ${esp32_ota.lib_deps}

[env:Meshadventurer_companion_radio_usb]
extends = env:Meshadventurer_sx1262_companion_radio_usb
build_flags =
  ${Meshadventurer_Auto.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=128
  -D MESH_NOTIFY_RTC_SETTINGS=1
  -D ENABLE_USB_INTERFACE
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Meshadventurer_Auto.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Meshadventurer_companion_radio_ble]
extends = env:Meshadventurer_sx1262_companion_radio_ble
build_flags =
  ${Meshadventurer_Auto.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=128
  -D MESH_NOTIFY_RTC_SETTINGS=1
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Meshadventurer_Auto.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Meshadventurer_terminal_chat]
extends = env:Meshadventurer_sx1262_terminal_chat
build_flags =
  ${Meshadventurer_Auto.build_flags}
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=1
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${Meshadventurer_Auto.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Meshadventurer_room_server]
extends = env:Meshadventurer_sx1262_room_server
build_flags =
  ${Meshadventurer_Auto.build_flags}
  -D ADVERT_NAME='"Meshadventurer Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${Meshadventurer_Auto.lib_deps}
  ${esp32_ota.lib_deps}

[env:Meshadventurer_kiss_modem]
extends = env:Meshadventurer_sx1262_kiss_modem
build_flags =
  ${Meshadventurer_Auto.build_flags}
build_src_filter =
  ${Meshadventurer_Auto.build_src_filter}
  +<../examples/kiss_modem/>

; M33S external-PA profiles: 8 dBm maximum chip drive in every role.
[env:Meshadventurer_m33s_repeater]
extends = env:Meshadventurer_repeater
build_unflags =
  ${e22_m33s.build_unflags}
  -D ADVERT_NAME='"Meshadventurer Repeater"'
build_flags =
  ${env:Meshadventurer_repeater.build_flags}
  ${e22_m33s.build_flags}
  -D MANUFACTURER_STRING='"Meshadventurer M33S"'
  -D ADVERT_NAME='"Meshadventurer M33S Repeater"'

[env:Meshadventurer_m33s_room_server]
