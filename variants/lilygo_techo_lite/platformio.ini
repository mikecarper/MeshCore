[LilyGo_T-Echo-Lite]
extends = rak4631_hw
board = t-echo
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${rak4631_hw.build_flags}
  -I variants/lilygo_techo_lite
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -D LILYGO_TECHO
  -D LILYGO_TECHO_LITE=1
  -D TECHO_LITE_DISPLAY_AUTODETECT=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_POWER_EN=30
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D P_LORA_TX_LED=LED_GREEN
  -D DISABLE_DIAGNOSTIC_OUTPUT
  -D ENV_INCLUDE_GPS=1
  -D GPS_BAUD_RATE=9600
  -D PIN_GPS_EN=GPS_EN
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_122_T61
  -D DISPLAY_ROTATION=4
  -D AUTO_OFF_MILLIS=0
build_src_filter = ${rak4631_hw.build_src_filter}
  +<helpers/*.cpp>
  +<TechoBoard.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/lilygo_techo_lite>
lib_deps =
  ${rak4631_hw.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME280 Library @ ^2.3.0
  https://github.com/SoulOfNoob/GxEPD2.git
  bakercp/CRC32 @ ^2.0.0
debug_tool = jlink
upload_protocol = nrfutil

[env:LilyGo_T-Echo-Lite_repeater]
extends = LilyGo_T-Echo-Lite
build_src_filter = ${LilyGo_T-Echo-Lite.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${LilyGo_T-Echo-Lite.build_flags}
  -D ADVERT_NAME='"T-Echo-Lite Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

[env:LilyGo_T-Echo-Lite_room_server]
extends = LilyGo_T-Echo-Lite
build_src_filter = ${LilyGo_T-Echo-Lite.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${LilyGo_T-Echo-Lite.build_flags}
  -D ADVERT_NAME='"T-Echo-Lite Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

; Keep the internal-staging targets above available for compatibility/recovery.
; These targets require the Lite-specific QSPI OTAFIX bootloader. Its ordinary
; application layout needs no reserved XIAO bootloader-update scratch bank.
; TechoBoard::begin keeps the shared radio/flash RT9080 rail at P0.30 enabled.
[env:LilyGo_T-Echo-Lite_repeater_lora_ota]
extends = env:LilyGo_T-Echo-Lite_repeater
board_build.ldscript = boards/nrf52840_s140_v6.ld
board_upload.maximum_size = 815104
extra_scripts = ${nrf52_lora_ota.extra_scripts}
build_flags =
  ${env:LilyGo_T-Echo-Lite_repeater.build_flags}
  ${nrf52_qspi_ota.build_flags}
build_src_filter = ${env:LilyGo_T-Echo-Lite_repeater.build_src_filter}
  +<helpers/ota/*.cpp>

[env:LilyGo_T-Echo-Lite_room_server_lora_ota]
extends = env:LilyGo_T-Echo-Lite_room_server
board_build.ldscript = boards/nrf52840_s140_v6.ld
board_upload.maximum_size = 815104
extra_scripts = ${nrf52_lora_ota.extra_scripts}
build_flags =
  ${env:LilyGo_T-Echo-Lite_room_server.build_flags}
  ${nrf52_qspi_ota.build_flags}
build_src_filter = ${env:LilyGo_T-Echo-Lite_room_server.build_src_filter}
  +<helpers/ota/*.cpp>

[env:LilyGo_T-Echo-Lite_companion_radio_ble]
extends = LilyGo_T-Echo-Lite
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${LilyGo_T-Echo-Lite.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  ; -D QSPIFLASH=1
  -D BLE_PIN_CODE=123456
  ; -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=9
  -D UI_SENSORS_PAGE=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
build_src_filter = ${LilyGo_T-Echo-Lite.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T-Echo-Lite.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T-Echo-Lite_kiss_modem]
extends = LilyGo_T-Echo-Lite
build_src_filter = ${LilyGo_T-Echo-Lite.build_src_filter}
  +<../examples/kiss_modem/>
[env:LilyGo_T-Echo-Lite_companion_radio_usb]
extends = LilyGo_T-Echo-Lite
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${LilyGo_T-Echo-Lite.build_flags}
  -I src/helpers/ui
  -I examples/companion_radio/ui-new
  -D ENABLE_USB_INTERFACE=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=9
  -D UI_SENSORS_PAGE=1
  -D AUTO_SHUTDOWN_MILLIVOLTS=3300
;  -D QSPIFLASH=1
build_src_filter = ${LilyGo_T-Echo-Lite.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_T-Echo-Lite.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_T-Echo-Lite_non_shell_companion_radio_ble]
; Legacy core-only name: the canonical image detects the fitted SSD1681 panel.
extends = env:LilyGo_T-Echo-Lite_companion_radio_ble

[env:LilyGo_T-Echo-Lite_non_shell_companion_radio_usb]
; Legacy core-only name: the canonical image detects the fitted SSD1681 panel.
extends = env:LilyGo_T-Echo-Lite_companion_radio_usb
