; =============================================================================
; SolarXiao (wehooper4) boards
; Same Xiao nRF52840 module. The carrier uses SDA=P0.09, SCL=P0.10
; on the NFC pads, and its INA260 is at 0x40. Skip the RTC probe because
; the LTC4162 charger shares the usual RTC address.
; 30S = standard SX1262 (22 dBm drive), 33S = 2W PA variant.
; SolarXiao specifies 8 dBm or lower for M33S; enforce this in every role.
; =============================================================================

[solarxiao]
extends = Xiao_nrf52
build_flags = ${Xiao_nrf52.build_flags}
  -D DISABLE_I2C_RTC_SCAN
  -D PIN_BOARD_SDA=PIN_NFC1
  -D PIN_BOARD_SCL=PIN_NFC2
  -D TELEM_INA260_ADDRESS=0x40
  -D MANUFACTURER_STRING='"SolarXiao 30S"'

[env:solarxiao_30S_companion_radio_ble]
extends = solarxiao
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${solarxiao.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D QSPIFLASH=1
build_src_filter = ${solarxiao.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${solarxiao.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:solarxiao_33S_companion_radio_ble]
extends = env:solarxiao_30S_companion_radio_ble
build_unflags =
  -D LORA_TX_POWER=22
  -D MANUFACTURER_STRING='"SolarXiao 30S"'
build_flags =
  ${env:solarxiao_30S_companion_radio_ble.build_flags}
  -D LORA_TX_POWER=8
  -D MAX_LORA_TX_POWER=8
  -D MANUFACTURER_STRING='"SolarXiao 33S"'

