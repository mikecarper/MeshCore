[Xiao_nrf52]
; Private qualification only: pass MC_XIAO_NRF52_HIL_FAST_SPI=1 together with
; SPI_32MHZ_INTERFACE=1 to test buffered 8 MHz on SPIM2. Neither is a default.
extends = rak4631_hw
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${rak4631_hw.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/xiao_nrf52
  -UENV_INCLUDE_GPS
  -D NRF52_PLATFORM
  -D NRF52_POWER_MANAGEMENT
  -D XIAO_NRF52
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; D6/D7 are also Serial1 TX/RX.  Auto-probing I2C there can hold the UART
  ; peripheral in a bad state and prevent boot/BLE startup.  Use the dedicated
  ; NFC pads for I2C on every XIAO nRF52 build.
  -D PIN_WIRE_SCL=PIN_NFC1
  -D PIN_WIRE_SDA=PIN_NFC2
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
build_src_filter = ${rak4631_hw.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/xiao_nrf52>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${rak4631_hw.lib_deps}
  ${sensor_base.lib_deps}

