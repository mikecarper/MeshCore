[wio_wm1110]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/wio_wm1110
  -D NRF52_PLATFORM
  -D WIO_WM1110
;  -D MESH_DEBUG=1
  -D RADIO_CLASS=CustomLR1110
  -D USE_LR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D LORA_TX_POWER=22
  -D RX_BOOSTED_GAIN=true
  -D P_LORA_DIO_1=40
  -D P_LORA_RESET=42
  -D P_LORA_BUSY=43
  -D P_LORA_NSS=44
  -D P_LORA_SCLK=45
  -D P_LORA_MOSI=46
  -D P_LORA_MISO=47
  -D LR11X0_DIO_AS_RF_SWITCH=true
  ; The WM1110 module uses a 1.6 V DIO3-controlled TCXO supply.
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.6
  -D RF_SWITCH_TABLE
  -D ENV_INCLUDE_GPS=0
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/wio_wm1110>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit LIS3DH @ ^1.2.4
  adafruit/Adafruit SHT4x Library @ ^1.0.4

[env:wio_wm1110_repeater]
extends = wio_wm1110
extra_scripts = ${nrf52_lora_ota.extra_scripts}
build_flags =
  ${wio_wm1110.build_flags}
  -D ADVERT_NAME='"WM1110 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D ENABLE_OTA=1
  -D OTA_FLASH_STORE=1
  -D OTA_FOLDER_SERIAL
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${wio_wm1110.build_src_filter}
  +<helpers/ota/*.cpp>
  +<../examples/simple_repeater/*.cpp>

[env:wio_wm1110_room_server]
extends = wio_wm1110
build_flags =
  ${wio_wm1110.build_flags}
  -D ADVERT_NAME='"WM1110 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${wio_wm1110.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:wio_wm1110_companion_radio_ble]
extends = wio_wm1110
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${wio_wm1110.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D QSPIFLASH=1
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${wio_wm1110.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${wio_wm1110.lib_deps}
  densaugeo/base64 @ ~1.4.0

; The dev kit's computer connection is CH340C -> UART0 (Arduino Serial1),
; not the nRF52840's native USB CDC port. Keep the historical BLE image exact;
; new installations can use both Companion transports in this Full image.
[env:wio_wm1110_companion_radio_full]
extends = env:wio_wm1110_companion_radio_ble
build_flags =
  ${env:wio_wm1110_companion_radio_ble.build_flags}
  -D MESHCORE_REQUIRES_COMPANION_RADIO_FULL=1
  -D COMPANION_RADIO_FULL=1
  -D ENABLE_USB_INTERFACE=1
  -D MESH_PRIMARY_UART_PORT=Serial1
  -D ENABLE_OTA=1
  -D OTA_SEEDER_ONLY=1
  -D MOTA_TARGET_ID=0
  -D OTA_FOLDER_SERIAL=1
  -D COMPANION_FEATURE_USB_MOTA_SOURCE=1
  -D COMPANION_FEATURE_BLE_MOTA_SOURCE=1
  -D OTA_SHARED_COMPANION_QUEUE=1
  -D OTA_TARGET_NAME_FRONT_CODED=1
  -D CFG_DEBUG=1
  -D RECOVERABLE_EXTERNAL_RADIO=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  ; Stock 64-byte UART RX lasts only 5.5 ms at 115200 baud. Keep complete
  ; Companion frames and CLI lines across normal radio scheduling intervals.
  -D SERIAL_BUFFER_SIZE=1024
build_src_filter = ${env:wio_wm1110_companion_radio_ble.build_src_filter}
  +<helpers/ota/*.cpp>

[env:wio_wm1110_kiss_modem]
extends = wio_wm1110
build_src_filter = ${wio_wm1110.build_src_filter}
  +<../examples/kiss_modem/>
