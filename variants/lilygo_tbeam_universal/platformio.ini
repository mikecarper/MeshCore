; Startup-detected SX126x/SX127x radio. Legacy chip-specific targets retain
; their original wiring, names, and OTA identities.

[LilyGo_TBeam]
extends = esp32_base
board = ttgo-t-beam
build_unflags =
  -fexceptions
build_flags =
  ${esp32_base.build_flags}
  -fno-exceptions
  -D PORTABLE_ESP32_ROM_NANO_FORMAT=1
  -I variants/lilygo_tbeam_universal
  -D TBEAM_SX1262
  -D P_LORA_DIO_0=26
  -D P_LORA_DIO_1=33
  -D P_LORA_BUSY=32
  -D P_LORA_NSS=18
  -D P_LORA_RESET=23
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=UniversalLoRaRadio
  -D WRAPPER_CLASS=UniversalLoRaRadio
  -D DISPLAY_CLASS=SSD1306Display
  -D LORA_TX_POWER=20
  -D P_LORA_TX_LED=4
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D PIN_GPS_RX=12
  -D PIN_GPS_TX=34
  -D PIN_USER_BTN=38
  -D ENV_INCLUDE_GPS=1
  -D USE_SX1276
  -D MESH_RADIO_AUTO_FAMILY=1
  -D MESH_RADIO_AUTO_SX127X=1
  -D SX127X_CURRENT_LIMIT=120
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/lilygo_tbeam_universal>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/esp32/TBeamBoard.cpp>
  +<helpers/sensors>
board_build.partitions = min_spiffs.csv ; get around 4mb flash limit
lib_deps =
  ${esp32_base.lib_deps}
  lewisxhe/XPowersLib@^0.2.7
  adafruit/Adafruit SSD1306 @ ^2.5.13
  stevemarple/MicroNMEA @ ^2.0.6
  boschsensortec/BSEC Software Library @ ^1.8.1492

[env:Tbeam_companion_radio_ble]
extends = env:Tbeam_SX1262_companion_radio_ble
build_flags =
  ${LilyGo_TBeam.build_flags}
  -I examples/companion_radio/ui-new
  ; Common classic-ESP32 capacity with both drivers and Full wireless/OTA.
  ; The legacy chip-specific targets retain their existing capacities.
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=40
  -D COMPANION_CHANNELS_RTC_STORAGE=1
  -D MESH_NOTIFY_RTC_SETTINGS=1
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TBeam.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Tbeam_companion_radio_ble_ps]
extends = env:Tbeam_companion_radio_ble

[env:Tbeam_repeater]
extends = env:Tbeam_SX1262_repeater
build_flags =
  ${LilyGo_TBeam.build_flags}
  -D ADVERT_NAME='"T-Beam Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31 ; classic ESP32 DRAM cannot fit the default 255 with LoRa OTA
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TBeam.lib_deps}
  ${esp32_ota.lib_deps}

[env:Tbeam_repeater_bridge_espnow]
extends = env:Tbeam_SX1262_repeater_bridge_espnow
build_flags =
  ${LilyGo_TBeam.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31 ; classic ESP32 DRAM cannot fit the default 255 with ESP-NOW
  -D WITH_ESPNOW_BRIDGE=1
  -D DISABLE_LORA_OTA=1 ; ESP-NOW plus LoRa OTA overflows this board's internal DRAM
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TBeam.lib_deps}
  ${esp32_ota.lib_deps}

[env:Tbeam_room_server]
extends = env:Tbeam_SX1262_room_server
build_flags =
  ${LilyGo_TBeam.build_flags}
  -D ADVERT_NAME='"T-Beam Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${LilyGo_TBeam.lib_deps}
  ${esp32_ota.lib_deps}

[env:Tbeam_kiss_modem]
extends = env:Tbeam_SX1262_kiss_modem
build_flags = ${LilyGo_TBeam.build_flags}
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<../examples/kiss_modem/>

[env:Tbeam_repeater_observer_mqtt]
extends = env:Tbeam_SX1262_repeater_observer_mqtt
extra_scripts =
  ${env:Tbeam_SX1262_repeater_observer_mqtt.extra_scripts}
  post:scripts/esp32_universal_radio_lto.py
build_flags =
  ${LilyGo_TBeam.build_flags}
  -flto
  -flto-partition=one
  -ffunction-sections
  -fdata-sections
  -mtext-section-literals
  -mlongcalls
  -mfix-esp32-psram-cache-issue
  -fno-tree-loop-im
  -fno-partial-inlining
  -mno-target-align
  -D MESH_UNIVERSAL_LTO=1
  -D MESH_COMPACT_ELEGANT_OTA=1 ; full authenticated OTA protocol, smaller page
  -D ADVERT_NAME='"T-Beam MQTT Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31 ; retain scope support within this observer's tight internal DRAM
  -D MQTT_MAX_PACKET_SIZE=1024
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TBeam.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

[env:Tbeam_room_server_observer_mqtt]
extends = env:Tbeam_SX1262_room_server_observer_mqtt
extra_scripts =
  ${env:Tbeam_SX1262_room_server_observer_mqtt.extra_scripts}
  post:scripts/esp32_universal_radio_lto.py
build_flags =
  ${LilyGo_TBeam.build_flags}
  -flto
  -flto-partition=one
  -ffunction-sections
  -fdata-sections
  -mtext-section-literals
  -mlongcalls
  -mfix-esp32-psram-cache-issue
  -fno-tree-loop-im
  -fno-partial-inlining
  -mno-target-align
  -D MESH_UNIVERSAL_LTO=1
  -D MESH_COMPACT_ELEGANT_OTA=1 ; full authenticated OTA protocol, smaller page
  -D ADVERT_NAME='"T-Beam Room Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D WITH_MQTT_BRIDGE=1
  -D MAX_NEIGHBOURS=50
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
build_src_filter =
  ${LilyGo_TBeam.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${LilyGo_TBeam.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1
