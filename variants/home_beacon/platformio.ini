; Standalone ESP32 yard beacon; no MeshCore radio role or OTA image.
[env:esp32_home_beacon]
platform = platformio/espressif32@6.11.0
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_deps = rweather/Crypto @ ^0.4.0
build_src_filter = -<*> +<../examples/home_beacon/main.cpp>
build_flags = -I src
