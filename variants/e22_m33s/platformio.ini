; External-PA E22 M33S modules need a different drive limit from M22/M30.
; 8 dBm is chip drive, not the amplified RF output. Never auto-detect this
; profile from an SX126x chip ID: the external amplifier is not identifiable.
[e22_m33s]
build_flags =
  -D MESH_E22_M33S=1
  -D LORA_TX_POWER=8
  -D MAX_LORA_TX_POWER=8
build_unflags =
  -D LORA_TX_POWER=22
  -D LORA_TX_POWER=20
  -D LORA_TX_POWER=9
  -D MAX_LORA_TX_POWER=20
  -D MAX_LORA_TX_POWER=9

[e22_m33s_nrf52]
build_flags = ${e22_m33s.build_flags}
build_unflags =
  ${nrf52_base.build_unflags}
  ${e22_m33s.build_unflags}

[e22_400m33s_nrf52]
build_flags =
  ${e22_m33s_nrf52.build_flags}
  -D USE_SX1268
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_FREQ=433.0
build_unflags =
  ${e22_m33s_nrf52.build_unflags}
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_FREQ=869.618
