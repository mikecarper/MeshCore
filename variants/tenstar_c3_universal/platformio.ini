; Startup-detected SX1262/SX1268. Chip-specific legacy recipes remain available.

[Tenstar_C3_Auto]
extends = Tenstar_esp32_C3
build_flags =
  ${esp32_base.build_flags}
  ${esp32_resident_radio_commands.build_flags}
  -I variants/tenstar_c3_universal
  -I variants/xiao_c3
  -D MANUFACTURER_STRING='"Tenstar C3"'
  -D ESP32_CPU_FREQ=80
  -D LORA_TX_BOOST_PIN=4
  -D P_LORA_TX_NEOPIXEL_LED=10
  -D PIN_VBAT_READ=1
  -D P_LORA_MISO=9
  -D P_LORA_SCLK=8
  -D P_LORA_MOSI=7
  -D P_LORA_DIO_1=2
  -D P_LORA_NSS=6
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=3
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D MESH_RADIO_AUTO_FAMILY=1
  -D MESH_RADIO_AUTO_SX1268=1
  -D MESH_RADIO_AUTO_SX127X=0
  -D USE_SX1262
  -D USE_SX1268
  -D RADIO_CLASS=UniversalLoRaRadio
  -D WRAPPER_CLASS=UniversalLoRaRadio
  -D LORA_TX_POWER=22
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/tenstar_c3_universal>
lib_deps = ${Tenstar_esp32_C3.lib_deps}

[env:Tenstar_C3_repeater]
extends = env:Tenstar_C3_sx1262_repeater
build_flags =
  ${Tenstar_C3_Auto.build_flags}
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"Tenstar C3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  ${Tenstar_C3_Auto.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Tenstar_C3_Auto.lib_deps}
  ${esp32_ota.lib_deps}

[env:Tenstar_C3_repeater_bridge_espnow]
extends = env:Tenstar_C3_sx1262_repeater_bridge_espnow
build_flags =
  ${Tenstar_C3_Auto.build_flags}
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter =
  ${Tenstar_C3_Auto.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Tenstar_C3_Auto.lib_deps}
  ${esp32_ota.lib_deps}

[env:Tenstar_C3_kiss_modem]
extends = env:Tenstar_C3_sx1262_kiss_modem
build_flags =
  ${Tenstar_C3_Auto.build_flags}
build_src_filter =
  ${Tenstar_C3_Auto.build_src_filter}
  +<../examples/kiss_modem/>
