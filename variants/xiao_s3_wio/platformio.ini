[Xiao_S3_WIO]
extends = esp32_base
board = seeed_xiao_esp32s3
board_check = true
board_build.mcu = esp32s3
build_flags = ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/xiao_s3_wio
  -UENV_INCLUDE_GPS
  -D SEEED_XIAO_S3
  -D PIN_VBAT_READ=1   ; D0
  -D P_LORA_DIO_1=39
  -D P_LORA_NSS=41
  -D P_LORA_RESET=42   ; RADIOLIB_NC
  -D P_LORA_BUSY=40   ;  DIO2 = 38
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=8
  -D P_LORA_MOSI=9
  -D PIN_USER_BTN=21
  -D PIN_STATUS_LED=48
  -D PIN_BOARD_SDA=D4
  -D PIN_BOARD_SCL=D5
  -D SX126X_RXEN=38
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D MC_SX1262_FAST_PROFILE_SWITCH=1
  -D MC_SX1262_FAST_FS=1
  -D MC_SX1262_FAST_PACKET_CACHE=1
  -D MC_SX1262_SPI_HZ=8000000
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_s3_wio>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_S3_WIO_repeater]
extends = Xiao_S3_WIO
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -D ADVERT_NAME='"XiaoS3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Xiao_S3_WIO.lib_deps}
  ${esp32_ota.lib_deps}

; Self-hosted Wi-Fi/LoRa receiver for the 1.25 MiB -> full-layout migration.
; The target ID is the exact successor Xiao_S3_WIO_repeater; this build must
; not automatically select an unrelated role. Hardware deployment still needs
; an A/B and power-interruption test before it is included in a release.
[env:Xiao_S3_WIO_partition_expander]
extends = Xiao_S3_WIO
board_build.partitions = default.csv
board_build.flash_mode = dio
board_upload.maximum_size = 1310720
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<../examples/partition_expander/*.cpp>
build_flags = ${Xiao_S3_WIO.build_flags}
  -D MESH_MIN_RUNTIME_HEAP=100352
  -D MOTA_MIGRATION_TARGET_ID=0x9f19bcd1
  ; Same adaptive four-block window as the accelerated LoRa bridges: fewer
  ; request/proof turnarounds without weakening per-block verification.
  -D OTA_FETCH_PIPELINE=4
lib_deps = ${Xiao_S3_WIO.lib_deps}
  ${esp32_ota.lib_deps}

; Generic source, XIAO-specific board definition. It is intentionally linked
; to default.csv so the stock legacy browser updater can install it.
[env:xiao_s3_partition_migrator]
platform = platformio/espressif32@6.11.0
board = seeed_xiao_esp32s3_migrator
framework = arduino
board_build.partitions = default.csv
board_build.flash_mode = dio
; This is a standalone ESP32 utility, but it still hosts a Wi-Fi OTA server.
; Reserve the generic ESP32 baseline plus its always-on Wi-Fi budget.
extra_scripts = post:scripts/check_firmware_ram.py
build_flags =
  -D ESP32_PLATFORM
  -D MESH_MIN_RUNTIME_HEAP=100352
  -I variants/xiao_s3_wio
build_src_filter =
  -<*>
  +<../examples/esp32_partition_migrator>
lib_deps =
  ESP32Async/AsyncTCP @ 3.5.0
  ESP32Async/ESPAsyncWebServer @ 3.12.0
  file://arch/esp32/AsyncElegantOTA

; LoRa-delivered first stage for an OTA-enabled Xiao_S3_WIO_repeater.
[env:xiao_s3_partition_migrator_lora_repeater]
extends = env:xiao_s3_partition_migrator
build_flags =
  ${env:xiao_s3_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_RESUME_OTA=1

; Disposable-hardware seed. It reproduces a real legacy identity file and
; exposes browser OTA without trying to squeeze a current full repeater into
; its historical 1.25 MiB app slot.
[env:xiao_s3_partition_legacy_seed]
platform = platformio/espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = default.csv
board_build.flash_mode = dio
; The disposable seed also runs an always-on Wi-Fi OTA server.
extra_scripts = post:scripts/check_firmware_ram.py
build_flags =
  -D ESP32_PLATFORM
  -D MESH_MIN_RUNTIME_HEAP=100352
  -I src
build_src_filter =
  -<*>
  +<../examples/esp32_partition_legacy_seed>
lib_deps =
  ESP32Async/AsyncTCP @ 3.5.0
  ESP32Async/ESPAsyncWebServer @ 3.12.0
  file://arch/esp32/AsyncElegantOTA

[env:xiao_s3_partition_migrator_test_hold]
extends = env:xiao_s3_partition_migrator
build_flags =
  ${env:xiao_s3_partition_migrator.build_flags}
  -D MESHCORE_MIGRATION_DELAY_MS=600000
  -D MESHCORE_MIGRATION_RESTART_DELAY_MS=0

[env:xiao_s3_partition_migrator_test_usb_diagnostic]
extends = env:xiao_s3_partition_migrator_test_hold
build_flags =
  ${env:xiao_s3_partition_migrator_test_hold.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1

