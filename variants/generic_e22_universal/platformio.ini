; Startup-detected SX1262/SX1268. Chip-specific legacy recipes remain available.

[Generic_E22_Auto]
extends = Generic_E22
build_flags =
  ${esp32_base.build_flags}
  -I variants/generic_e22_universal
  -D GENERIC_E22
  -D P_LORA_TX_LED=2
  -D PIN_VBAT_READ=35
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=18
  -D P_LORA_RESET=23
  -D P_LORA_BUSY=32
  -D P_LORA_SCLK=5
  -D P_LORA_MOSI=27
  -D P_LORA_MISO=19
  -D SX126X_TXEN=13
  -D SX126X_RXEN=14
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D MESH_RADIO_AUTO_FAMILY=1
  -D MESH_RADIO_AUTO_SX1268=1
  -D MESH_RADIO_AUTO_SX127X=0
  -D USE_SX1262
  -D USE_SX1268
  -D RADIO_CLASS=UniversalLoRaRadio
  -D WRAPPER_CLASS=UniversalLoRaRadio
  -D LORA_TX_POWER=22
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/generic_e22_universal>
lib_deps = ${Generic_E22.lib_deps}

[env:Generic_E22_repeater]
extends = env:Generic_E22_sx1262_repeater
build_flags =
  ${Generic_E22_Auto.build_flags}
  -D ADVERT_NAME='"E22 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31
build_src_filter =
  ${Generic_E22_Auto.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Generic_E22_Auto.lib_deps}
  ${esp32_ota.lib_deps}

[env:Generic_E22_repeater_bridge_espnow]
extends = env:Generic_E22_sx1262_repeater_bridge_espnow
build_flags =
  ${Generic_E22_Auto.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D FLOOD_CHANNEL_SCOPE_SLOTS=31
  -D WITH_ESPNOW_BRIDGE=1
  -D DISABLE_LORA_OTA=1
build_src_filter =
  ${Generic_E22_Auto.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Generic_E22_Auto.lib_deps}
  ${esp32_ota.lib_deps}

; M33S external-PA profiles: 8 dBm maximum chip drive in every role.
[env:Generic_E22_m33s_repeater]
extends = env:Generic_E22_repeater
build_unflags =
  ${e22_m33s.build_unflags}
  -D ADVERT_NAME='"E22 Repeater"'
build_flags =
  ${env:Generic_E22_repeater.build_flags}
  ${e22_m33s.build_flags}
  -D MANUFACTURER_STRING='"Generic E22 M33S"'
  -D ADVERT_NAME='"Generic E22 M33S Repeater"'

[env:Generic_E22_m33s_repeater_bridge_espnow]
extends = env:Generic_E22_repeater_bridge_espnow
build_unflags =
  ${e22_m33s.build_unflags}
  -D ADVERT_NAME='"ESPNow Bridge"'
build_flags =
  ${env:Generic_E22_repeater_bridge_espnow.build_flags}
  ${e22_m33s.build_flags}
  -D MANUFACTURER_STRING='"Generic E22 M33S"'
  -D ADVERT_NAME='"Generic E22 M33S Repeater"'

[env:Generic_E22_m33s_kiss_modem]
extends = env:Generic_E22_kiss_modem
build_unflags =
  ${e22_m33s.build_unflags}
build_flags =
  ${env:Generic_E22_kiss_modem.build_flags}
  ${e22_m33s.build_flags}
  -D MANUFACTURER_STRING='"Generic E22 M33S"'
