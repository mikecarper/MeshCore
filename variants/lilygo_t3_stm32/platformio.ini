[lilygo_t3_stm32]
extends = stm32_base
platform_packages = platformio/toolchain-gccarmnoneeabi@^1.140201.0
build_unflags = -Os
board = lilygo_t3_stm32
board_upload.maximum_size = 229376 ; final 32 KiB reserved for InternalFS
build_flags = ${stm32_base.build_flags}
  ; Use the same GCC 14 size profile as this fork's Wio STM32 builds.
  ; The board's application and filesystem boundaries remain fixed.
  -Oz
  -flto
  -fno-inline-small-functions
  -fipa-pta
  -fmerge-all-constants
  -fno-ipa-cp-clone
  -fno-partial-inlining
  -fno-semantic-interposition
  -fno-unwind-tables
  -fno-asynchronous-unwind-tables
  -fno-schedule-insns2
  -Wl,--sort-section=alignment
  -include variants/lilygo_t3_stm32/STM32ArduinoCompat.h
  -I variants/lilygo_t3_stm32
  -D RADIO_CLASS=CustomSTM32WLx
  -D WRAPPER_CLASS=CustomSTM32WLxWrapper
  -D LORA_TX_POWER=20
  -D SX126X_CURRENT_LIMIT=140
  -D RX_BOOSTED_GAIN=true
  -D STM32WL_TCXO_VOLTAGE=0 ; crystal oscillator; manufacturer sets IS_TCXO_SUPPORTED=0
  -D PIN_SERIAL_TX=PA9
  -D PIN_SERIAL_RX=PA10
  -D SERIAL_UART_INSTANCE=1
  -D PIN_SPI_SCK=PA5
  -D PIN_SPI_MISO=PA6
  -D PIN_SPI_MOSI=PA7
  -D PIN_OLED_CS=PB12
  -D PIN_OLED_DC=PA8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=PH3
  -D USER_BTN_PRESSED=HIGH
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/lilygo_t3_stm32>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps = ${stm32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3_STM32_kiss_modem]
extends = lilygo_t3_stm32
build_src_filter = ${lilygo_t3_stm32.build_src_filter}
  +<../examples/kiss_modem/>
