; Waveshare ESP32-S3-LR1121 (HF: 850-930 MHz + 2.4 GHz)
; ESP32-S3FH4R2 (4MB flash, 2MB PSRAM), native USB-CDC via the Tiny-Adapter FPC.
; No user LED, battery sense or user button (BOOT is GPIO0).
[Waveshare_S3_LR1121]
extends = esp32_base
board = esp32-s3-zero
; Standard roles share 1.9MB OTA slots. MQTT observer roles below require the
; 1984KiB layout, installed by the verified partition-migration recipe or a
; merged USB image; their SPIFFS filesystem is 64KiB.
board_build.partitions = min_spiffs.csv
build_flags = ${esp32_base.build_flags}
  -I variants/waveshare_esp32s3_lr1121
  -D BOARD_HAS_PSRAM
  -D P_LORA_DIO_1=38
  -D P_LORA_NSS=42
  -D P_LORA_RESET=39
  -D P_LORA_BUSY=41
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=46
  -D P_LORA_MOSI=45
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D LR1121_FORCE_HP_PA   ; RFO_LP_LF is not fitted (R4 NC)
  -D RX_BOOSTED_GAIN=true
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/waveshare_esp32s3_lr1121>
lib_deps =
  ${esp32_base.lib_deps}

[env:Waveshare_S3_LR1121_repeater]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D ADVERT_NAME='"Waveshare LR1121 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_S3_LR1121_room_server]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D ADVERT_NAME='"Waveshare LR1121 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_S3_LR1121_companion_radio_usb]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Waveshare_S3_LR1121_companion_radio_ble]
extends = Waveshare_S3_LR1121
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Canonical all-transport Companion. build.sh applies the shared source-only
; Full profile and 4 MiB flash partition policy; exact USB/BLE aliases remain.
[env:Waveshare_S3_LR1121_companion_radio_full]
extends = env:Waveshare_S3_LR1121_companion_radio_usb
board_build.flash_mode = ${esp32_s3_full.board_build.flash_mode}
build_flags =
  ${env:Waveshare_S3_LR1121_companion_radio_usb.build_flags}
  -D MESHCORE_REQUIRES_COMPANION_RADIO_FULL=1

[env:Waveshare_S3_LR1121_kiss_modem]
extends = Waveshare_S3_LR1121
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/kiss_modem/>

[env:Waveshare_S3_LR1121_repeater_observer_mqtt]
extends = Waveshare_S3_LR1121
board_build.partitions = variants/dual_ota_full_4MB.csv
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D ADVERT_NAME='"MQTT Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D ESP32_CPU_FREQ=160
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

[env:Waveshare_S3_LR1121_room_server_observer_mqtt]
extends = Waveshare_S3_LR1121
board_build.partitions = variants/dual_ota_full_4MB.csv
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${Waveshare_S3_LR1121.build_flags}
  -D ADVERT_NAME='"Waveshare LR1121 Room Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D ESP32_CPU_FREQ=160
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

; Wireless source layout is checked at runtime, never inferred from this
; default.csv link map. Both Wi-Fi and LoRa first stages preserve configuration
; and start the exact observer receiver only after verified restoration.
; These recipes are not hardware-qualified A/B or power-cut test results.
[Waveshare_S3_LR1121_partition_expander]
extends = Waveshare_S3_LR1121
board = waveshare_s3_lr1121_migrator
board_build.partitions = default.csv
board_build.flash_mode = dio
board_upload.maximum_size = 1310720
build_src_filter = ${Waveshare_S3_LR1121.build_src_filter}
  +<../examples/partition_expander/*.cpp>
build_flags = ${Waveshare_S3_LR1121.build_flags}
  -D MESH_MIN_RUNTIME_HEAP=100352
  -D MESHCORE_MIGRATION_STRICT_4MB=1
  -D OTA_FETCH_PIPELINE=4
lib_deps = ${Waveshare_S3_LR1121.lib_deps}
  ${esp32_ota.lib_deps}

[env:Waveshare_S3_LR1121_partition_expander_repeater_observer_mqtt]
extends = Waveshare_S3_LR1121_partition_expander
build_flags = ${Waveshare_S3_LR1121_partition_expander.build_flags}
  -D MOTA_MIGRATION_TARGET_ID=0xcbe54778

[env:Waveshare_S3_LR1121_partition_expander_room_server_observer_mqtt]
extends = Waveshare_S3_LR1121_partition_expander
build_flags = ${Waveshare_S3_LR1121_partition_expander.build_flags}
  -D MOTA_MIGRATION_TARGET_ID=0x3de413b1
