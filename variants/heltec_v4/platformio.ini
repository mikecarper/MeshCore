[env:heltec_v4_kiss_modem]
extends = Heltec_lora32_v4
build_unflags =
  -DARDUINO_USB_MODE=0
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -DARDUINO_USB_MODE=1
  ; KISS radio2 scanning stays on the board. This narrowly opts this target
  ; into the guarded SX1262 RX-to-RX fast path and buffered 8 MHz SPI.  The
  ; host-powered modem also uses the established V4 160 MHz role override;
  ; normal V4 images retain their lower-power 80 MHz policy.
  -D MC_SX1262_FAST_PROFILE_SWITCH=1
  -D MC_SX1262_BUFFERED_RADIO_HAL=1
  -D MC_SX1262_SPI_HZ=8000000
  -D ESP32_CPU_FREQ=160
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
  +<../examples/kiss_modem/>

; One-time Wi-Fi-only migration bridge for legacy Heltec V4/V4.3 OLED
; repeaters that still use Arduino's 1.25 MiB OTA slots.  It is deliberately
; linked against default.csv so the existing browser updater can install it.
; On first boot it stages /identity/_main.id in unchanged NVS, makes a
; CRC-verified copy of legacy SPIFFS, copies itself to app0 when necessary,
; then publishes default_16MB. It restores the identity after the larger
; SPIFFS region initializes and exposes a browser updater for the full image.
[env:heltec_v4_partition_migrator]
platform = platformio/espressif32@6.11.0
board = heltec_v4_migrator
framework = arduino
board_build.partitions = default.csv
; The V4's ROM/bootloader chain is reliable with DIO. The final Full image
; uses the same setting, so there is no flash-mode transition after migration.
board_build.flash_mode = dio
; The partition-table erase disables the flash cache. Native USB CDC can still
; raise a flash-backed event ISR during that interval, even after Serial.end().
; The Wi-Fi-only bridge therefore keeps CDC disabled; the final regular
; repeater build restores its normal USB serial setting.
build_flags =
  -I variants/heltec_v4
build_src_filter =
  -<*>
  +<../examples/esp32_partition_migrator>
lib_deps =
  ESP32Async/AsyncTCP @ 3.5.0
  ESP32Async/ESPAsyncWebServer @ 3.12.0
  file://arch/esp32/AsyncElegantOTA

  ; Disposable-hardware harness: leaves a ten-minute Wi-Fi OTA window for
  ; installing the production bridge into legacy slot B. This is not a release
  ; profile.
[env:heltec_v4_partition_migrator_test_hold]
extends = env:heltec_v4_partition_migrator
build_flags =
  ${env:heltec_v4_partition_migrator.build_flags}
    -D MESHCORE_MIGRATION_DELAY_MS=600000
  -D MESHCORE_MIGRATION_RESTART_DELAY_MS=0

  ; Harness-only diagnostic: USB CDC is restored so a failed AP startup can be
  ; distinguished from a board which never left its bootloader.  It retains
  ; the same ten-minute no-write window as test_hold.
[env:heltec_v4_partition_migrator_test_usb_diagnostic]
extends = env:heltec_v4_partition_migrator_test_hold
build_flags =
  ${env:heltec_v4_partition_migrator_test_hold.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
