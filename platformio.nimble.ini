lib_ignore = ${companion_nimble_trial.lib_ignore}

[env:heltec_tracker_v2_ram_trial_companion_radio_full_femon_nimble]
extends = env:heltec_tracker_v2_companion_radio_full_femon
board_build.flash_mode = dio
build_flags =
