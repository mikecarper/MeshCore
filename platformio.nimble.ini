; Opt-in hardware qualification builds. This file is not part of the normal
; release matrix. See docs/nimble_companion_trial.md for activation and tests.
[companion_nimble_trial]
build_flags =
  -D MESH_USE_NIMBLE_ARDUINO=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_MAX_BONDS=15
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=30
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
lib_deps = h2zero/NimBLE-Arduino @ 2.5.1
lib_ignore = ESP32 BLE Arduino

[env:heltec_v4_2_v4_3_companion_radio_full_femon_nimble]
extends = env:heltec_v4_2_v4_3_companion_radio_full_femon
build_flags =
  ${env:heltec_v4_2_v4_3_companion_radio_full_femon.build_flags}
  ${companion_nimble_trial.build_flags}
lib_deps =
  ${env:heltec_v4_companion_radio_wifi_mqtt_femon.lib_deps}
  ${companion_nimble_trial.lib_deps}
lib_ignore = ${companion_nimble_trial.lib_ignore}

; Legacy trial name; UI_SMALL_MESSAGE_FONT now selects 5px or 6px by panel size.
[env:heltec_v4_2_v4_3_companion_radio_full_femon_nimble_pixel5]
extends = env:heltec_v4_2_v4_3_companion_radio_full_femon_nimble
build_flags =
  ${env:heltec_v4_2_v4_3_companion_radio_full_femon_nimble.build_flags}
  -D UI_SMALL_MESSAGE_FONT=1
  -D UI_MSG_PREVIEW_SIZE=161

[env:Xiao_S3_WIO_companion_radio_full_nimble]
extends = env:Xiao_S3_WIO_companion_radio_full
build_flags =
  ${env:Xiao_S3_WIO_companion_radio_full.build_flags}
  ${companion_nimble_trial.build_flags}
lib_deps =
  ${env:Xiao_S3_WIO_companion_radio_wifi.lib_deps}
  ${companion_nimble_trial.lib_deps}
lib_ignore = ${companion_nimble_trial.lib_ignore}

; Non-PSRAM Full Companions: compare at the original 350/40/256 capacity.
; The ram_trial infix keeps the ordinary release's 150-contact overlay out of
; these explicit qualification profiles. Firmware RAM guards remain enabled.
[companion_nimble_ram_trial]
build_flags =
  ${companion_nimble_trial.build_flags}
  -D MESH_CONTACT_CACHE=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D OTA_SHARED_COMPANION_QUEUE=1
  -D MESHCORE_REQUIRES_COMPANION_RADIO_FULL=1

[env:Heltec_v3_ram_trial_companion_radio_full_nimble]
extends = env:Heltec_v3_companion_radio_full
board_build.flash_mode = dio
build_flags =
  ${env:Heltec_v3_companion_radio_full.build_flags}
  ${companion_nimble_ram_trial.build_flags}
lib_deps =
  ${env:Heltec_v3_companion_radio_full.lib_deps}
  ${companion_nimble_trial.lib_deps}
lib_ignore = ${companion_nimble_trial.lib_ignore}

[env:Heltec_Wireless_Tracker_ram_trial_companion_radio_full_nimble]
extends = env:Heltec_Wireless_Tracker_companion_radio_ble
board_build.flash_mode = dio
build_flags =
  ${env:Heltec_Wireless_Tracker_companion_radio_ble.build_flags}
  ${companion_nimble_ram_trial.build_flags}
lib_deps =
  ${env:Heltec_Wireless_Tracker_companion_radio_ble.lib_deps}
