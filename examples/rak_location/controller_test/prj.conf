# Link the native Find My SDK including physical sound and motion support.
CONFIG_FMNA=y
CONFIG_FMNA_NORDIC_PRODUCT_PLAN=n
CONFIG_FMNA_MANUFACTURER_NAME="MeshCore"
CONFIG_FMNA_MODEL_NAME="RAK WisMesh Tag"
CONFIG_FMNA_CAPABILITY_PLAY_SOUND_ENABLED=y
CONFIG_FMNA_CAPABILITY_DETECT_MOTION_ENABLED=y
CONFIG_FMNA_CAPABILITY_BLE_SN_LOOKUP_ENABLED=y
CONFIG_FMNA_BATTERY_TYPE_RECHARGEABLE=y
CONFIG_FMNA_PAIRING_MODE_AUTOSTART=n
CONFIG_FMNA_SERVICE_HIDDEN_MODE=y
CONFIG_BT_ID_MAX=4
CONFIG_BT_EXT_ADV_MAX_ADV_SET=4
CONFIG_SETTINGS_NVS_SECTOR_COUNT=2
