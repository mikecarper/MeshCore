CONFIG_SIDEWALK=y
CONFIG_STATIC_INIT_GNU=y
CONFIG_SIDEWALK_BLE_NAME="RAK Tag"
CONFIG_PARTITION_MANAGER_ENABLED=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_NEWLIB_LIBC=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SHELL=y
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_SETTINGS=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SIDEWALK_DFU=n
CONFIG_BOOTLOADER_MCUBOOT=n
# Sidewalk v1.2.0's nRF52 storage backend for bootloaders without NSIB.
CONFIG_TRUSTED_STORAGE_BACKEND_AEAD_KEY_HASH_UID=y
CONFIG_CC3XX_ATOMIC_LOCK=y
CONFIG_PSA_USE_CC3XX_KEY_AGREEMENT_DRIVER=n
CONFIG_PSA_USE_CC3XX_ASYMMETRIC_SIGNATURE_DRIVER=n
CONFIG_PSA_USE_CC3XX_ASYMMETRIC_ENCRYPTION_DRIVER=n
CONFIG_PSA_USE_CC3XX_KEY_MANAGEMENT_DRIVER=n
