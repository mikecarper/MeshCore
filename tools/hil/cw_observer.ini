; A separate, RAM-only RSSI/packet witness for CW validation. No autonomous TX.
[env:cw_observer_rak4631]
extends = arduino_base
platform = nordicnrf52
platform_packages = ${nrf52_base.platform_packages}
board = rak4631
board_build.variants_dir = tools/hil
board_build.variant = cw_observer_variant
board_build.ldscript = boards/nrf52840_s140_v6.ld
upload_protocol = nrfutil
extra_scripts = create-uf2.py
  pre:scripts/nrf52_usb_power_fix.py
lib_deps =
  SPI
  https://github.com/jgromes/RadioLib.git#187ef24791c3d844939b2be13a68bd890bd04e4c
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
build_src_filter = +<../tools/hil/cw_observer.cpp>
