; Receive-only T-Deck display/radio scheduler A/B harness.
; Include this file in platformio.local.ini's extra_configs, then build
; tdeck_display_switch. No identity, persisted settings, network, or TX.
[env:tdeck_display_switch]
extends = arduino_base
platform = platformio/espressif32@6.11.0
board = t-deck
board_build.flash_mode = dio
upload_speed = 115200
lib_deps =
  SPI
  Wire
  https://github.com/jgromes/RadioLib.git#2325a38a89dd0f0e402c19f67fe910111da1e246
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
extra_scripts =
  pre:scripts/esp32_wifi_scan_fix.py
  post:scripts/check_firmware_ram.py
build_flags =
  ${arduino_base.build_flags}
  -D ESP32_PLATFORM
  -D LILYGO_TDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USE_SX1262
  -D MC_SX1262_HIL=1
  -D LORA_TX_POWER=0
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_DIO_1=45
  -D P_LORA_NSS=9
  -D P_LORA_RESET=17
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=38
  -D P_LORA_MOSI=41
  -D PIN_PERF_POWERON=10
  -D PIN_TFT_RST=-1
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=42
  -D PIN_TFT_CS=12
  -D PIN_TFT_DC=11
  -D PIN_TFT_SCL=40
  -D PIN_TFT_SDA=41
build_src_filter =
  +<helpers/radiolib/RadioLibWrappers.cpp>
  +<helpers/UsbLogging.cpp>
  +<helpers/ui/DisplayDriver.cpp>
  +<helpers/ui/DisplayPowerSettings.cpp>
  +<helpers/ui/DisplayRotationSettings.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<../tools/hil/tdeck_display_switch.cpp>
