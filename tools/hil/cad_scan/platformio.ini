[platformio]
default_envs = xiao, v4

[env]
platform = platformio/espressif32@6.11.0
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
lib_deps = https://github.com/jgromes/RadioLib.git#187ef24791c3d844939b2be13a68bd890bd04e4c
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D RADIOLIB_GODMODE=1

[env:xiao]
build_flags = ${env.build_flags} -D CAD_BOARD_XIAO=1

[env:v4]
build_flags = ${env.build_flags} -D CAD_BOARD_V4=1
