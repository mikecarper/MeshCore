; HIL ONLY: SenseCAP Indicator D1 LoRa / ESP32-S3 N8R8 (8 MiB flash, OPI PSRAM).
; Reviewed Mercerwood unit MAC d8:3b:da:75:23:ac. Flash only after the normal
; mcfirmware adapter independently confirms that MAC and 8,388,608 flash bytes.
; No production variant or default environment is changed by this file.
;
; In the isolated build checkout, include this through platformio.local.ini:
; [platformio]
; extra_configs = variants/*/platformio.ini
;                 tools/hil/indicator_repeater_espnow.ini
;
; Validate offline (does not invoke PlatformIO):
; python3 -m unittest discover -s test -p test_indicator_repeater_hil_recipe.py
; Build directly, one PlatformIO process only:
; pio run -e SenseCapIndicator-LoRa_repeater_bridge_espnow_hil
;
; Deliberately do not use build.sh's release/full promotion for this test-only
; environment: its hardware partition/role identity and quiet RF defaults are
; specified here. This is a full-feature LoRa repeater plus ESP-NOW bridge, not
; the primary-ESP-NOW Companion variant. No flashing/erasing runs from this file.

[hil_indicator_espnow]
lora_frequency = 908.5
lora_bandwidth = 500
lora_sf = 5
lora_cr = 5
tx_power = 2
firmware_version = v1.18.0.1.hil-indicator-espnow-9085

[env:SenseCapIndicator-LoRa_repeater_bridge_espnow_hil]
extends = SenseCapIndicator-LoRa
board_build.partitions = variants/sensecap_indicator-espnow/dual_ota_2560k_preserve_spiffs.csv
board_upload.maximum_size = 2621440
build_unflags =
  -D DISPLAY_CLASS=SCIndicatorDisplay
  -D MESH_PRIMARY_ESPNOW=1
  -D DISABLE_WIFI_OTA=1
  -D ENABLE_ADVERT_ON_BOOT=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_TX_POWER=22
build_flags =
  ${SenseCapIndicator-LoRa.build_flags}
  -UDISPLAY_CLASS
  -UMESH_PRIMARY_ESPNOW
  -UDISABLE_WIFI_OTA
  -UWEBCONFIG_DISABLED
  -D WITH_ESPNOW_BRIDGE=1
  -D ADVERT_NAME='"Indicator ESPNow HIL"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=254
  -D ENABLE_ADVERT_ON_BOOT=0
  -D DEFAULT_ADVERT_INTERVAL_MINUTES=0
  -D DEFAULT_FLOOD_ADVERT_INTERVAL_HOURS=0
  -D LORA_FREQ=${hil_indicator_espnow.lora_frequency}
  -D LORA_BW=${hil_indicator_espnow.lora_bandwidth}
  -D LORA_SF=${hil_indicator_espnow.lora_sf}
  -D LORA_CR=${hil_indicator_espnow.lora_cr}
  -D LORA_TX_POWER=${hil_indicator_espnow.tx_power}
  -D MESH_HIL_TX_FREQ_MHZ=${hil_indicator_espnow.lora_frequency}
  -D MESHCORE_EXPANDED_PARTITION_PROFILE=1
  -D WIFI_OTA_SEEDER=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D ASYNCWEBSERVER_USE_CHUNK_INFLIGHT=0
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D FIRMWARE_VERSION='"${hil_indicator_espnow.firmware_version}"'
  -D OTA_VARIANT='"SenseCapIndicator-LoRa_repeater_bridge_espnow_hil"'
  -D MOTA_HW_ID='"SenseCapIndicator-LoRa"'
build_src_filter =
  ${SenseCapIndicator-LoRa.build_src_filter}
  -<helpers/ui/LGFXDisplay.cpp>
  -<../variants/sensecap_indicator-espnow/IndicatorFontClient.cpp>
  +<helpers/bridges/ESPNowBridge.cpp>
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${SenseCapIndicator-LoRa.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

; Fresh prefs already select bridge.format=wrapped, bridge.channel=1, bridge
; forwarding of RX packets, and the existing lab bridge secret. LoRa remains
; primary. Saved prefs override all compiled defaults: root must explicitly
; verify get radio/get lab.tx/get bridge.format/get espnow.enabled after flash.
; This preserves the existing settings map, not an automatic partition-table
; migration. Installing the 2.5 MiB map requires a checked merged-image flash
; or the established in-place partition migration workflow.
