; Experimental builds only. Copy to ignored platformio.local.ini to enable.
; A/B variants differ only in OTA storage and their version label.
[soak_common]
build_flags =
  -D MESH_SOAK_DIAGNOSTICS=1
  -D FIRMWARE_BUILD_DATE='"11-Sep-2026"'
  -D FIRMWARE_BUILD_EPOCH=1789106400

[env:soak_v4_repeater_static]
extends = env:heltec_v4_repeater_observer_mqtt
build_flags =
  ${env:heltec_v4_repeater_observer_mqtt.build_flags}
  ${soak_common.build_flags}
  -D FIRMWARE_VERSION='"v1.17.1-soak-v4-A"'
  -D MESH_SOAK_WIFI_KEY_OVERRIDE=1
  -D MESHCORE_EXPANDED_PARTITION_PROFILE=1
  -D LIGHTWEIGHT_WIFI_OTA=1
build_unflags = -fexceptions
board_ssl_cert_source = folder

[env:soak_v4_repeater_heap]
extends = env:soak_v4_repeater_static
build_flags =
  ${env:soak_v4_repeater_static.build_flags}
  -D OTA_HEAP_CONTEXT=1
  -D FIRMWARE_VERSION='"v1.17.1-soak-v4-B"'

[env:soak_indicator_companion_static]
extends = env:SenseCapIndicator-LoRa_comp_radio_usb_wifi
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = folder
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_unflags =
  -D DISABLE_WIFI_OTA=1
  -D OTA_FLASH_STORE=1
  -fexceptions
build_flags =
  ${env:SenseCapIndicator-LoRa_comp_radio_usb_wifi.build_flags}
  ${soak_common.build_flags}
  -D FIRMWARE_VERSION='"v1.17.1-soak-ind-A"'
  -D COMPANION_RADIO_FULL=1
  -D OTA_SEEDER_ONLY=1
  -D MOTA_TARGET_ID=0
  -D BLE_PIN_CODE=123456
  -D COMPANION_EXCLUSIVE_WIFI_BLE=1
  -D COMPANION_FEATURE_TEMP_RADIO=1
  -D COMPANION_FEATURE_OTA_CLI=1
  -D COMPANION_FEATURE_USB_MOTA_SOURCE=1
  -D COMPANION_FEATURE_NETWORK_TERMINAL=1
  -D COMPANION_FEATURE_MEMORY_DIAGNOSTICS=1
  -D WIFI_OTA_SEEDER=1
  -D MESHCORE_EXPANDED_PARTITION_PROFILE=1
  -D LIGHTWEIGHT_WIFI_OTA=1
  -D WITH_MQTT_BRIDGE=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -fno-exceptions
; Retain this base recipe's 320x320 canvas in both A/B images. Native 480x480
; Full + MQTT is not a qualified published profile and exceeds its RAM budget.
build_src_filter =
  ${env:SenseCapIndicator-LoRa_comp_radio_usb_wifi.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
lib_deps =
  ${env:SenseCapIndicator-LoRa_comp_radio_usb_wifi.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

[env:soak_indicator_companion_heap]
extends = env:soak_indicator_companion_static
build_flags =
  ${env:soak_indicator_companion_static.build_flags}
  -D OTA_HEAP_CONTEXT=1
  -D FIRMWARE_VERSION='"v1.17.1-soak-ind-B"'

[env:soak_xiao_repeater_static]
extends = env:Xiao_S3_WIO_repeater_observer_mqtt
board_ssl_cert_source = folder
build_unflags = -fexceptions
build_flags =
  ${env:Xiao_S3_WIO_repeater_observer_mqtt.build_flags}
  ${soak_common.build_flags}
  -D MESH_SOAK_WIFI_KEY_OVERRIDE=1
  -D FIRMWARE_VERSION='"v1.17.1-soak-xiao-A"'
  -D LORA_FREQ=910.525
  -D LORA_SF=7
  -D ADVERT_NAME='"HIL-XIAO-S3"'
  -D MESHCORE_EXPANDED_PARTITION_PROFILE=1
  -D LIGHTWEIGHT_WIFI_OTA=1

[env:soak_xiao_repeater_heap]
extends = env:soak_xiao_repeater_static
build_flags =
  ${env:soak_xiao_repeater_static.build_flags}
  -D OTA_HEAP_CONTEXT=1
  -D FIRMWARE_VERSION='"v1.17.1-soak-xiao-B"'
